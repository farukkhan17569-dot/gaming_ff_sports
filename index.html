<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join - Gaming FF Sports</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d1d;
      color: white;
      text-align: center;
    }

    header {
      padding: 35px 15px;
      background: linear-gradient(135deg, #6633ff, #00aaff);
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    .box {
      margin: 35px 20px;
      padding: 30px 20px;
      background: #151d36;
      border: 1px solid #293866;
      border-radius: 20px;
    }

    input {
      width: 100%;
      max-width: 400px;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 14px 35px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #6633ff, #00aaff);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
    }

    a {
      color: #00aaff;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 Gaming FF Sports</h1>
    <p>Join Our Gaming Community</p>
  </header>

  <div class="box">
    <h2>🔥 Join Now</h2>
    <p>Gaming FF Sports-এ যোগ দিতে নিচের তথ্য দাও</p>

    <input type="text" id="name" placeholder="তোমার নাম">
    <br>

    <input type="text" id="uid" placeholder="Free Fire UID">
    <br>

    <button onclick="joinNow()">Join Now</button>

    <div id="message"></div>
  </div>

  <p>
    <a href="index.html">⬅️ Home এ ফিরে যাও</a>
  </p>

  <script>
    function joinNow() {
      const name = document.getElementById("name").value.trim();
      const uid = document.getElementById("uid").value.trim();
      const message = document.getElementById("message");

      if (name === "" || uid === "") {
        message.innerHTML = "⚠️ নাম এবং Free Fire UID লিখো।";
        return;
      }

      message.innerHTML =
        "✅ ধন্যবাদ " + name + "! তোমার Join Request নেওয়া হয়েছে।";
    }
  </script>

</body>
</html>
